<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101827">
    <meta name="description" content="Hub de Inovação PDI GT">
    <title>Hub_de_Inovacao_PDI_GT</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #101827;
        color: #f4f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(ellipse at 50% 0%, rgb(32 115 105 / 32%), transparent 55%),
          #101827;
      }

      main {
        width: min(100%, 760px);
        padding: clamp(2rem, 7vw, 5rem);
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 24px;
        background: rgb(19 30 47 / 88%);
        box-shadow: 0 24px 80px rgb(0 0 0 / 28%);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #73d9bd;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 4rem);
        line-height: 1.12;
        overflow-wrap: anywhere;
      }

      .rule {
        width: 64px;
        height: 4px;
        margin: 2rem auto;
        border-radius: 4px;
        background: #73d9bd;
      }

      .repo {
        margin: 0;
        color: #bdc8d8;
        font-size: 1rem;
      }

      code {
        color: #f4f7fb;
        font-family: Consolas, "Courier New", monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Inovação · Pesquisa · Desenvolvimento</p>
      <h1>Hub_de_Inovacao_PDI_GT</h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="repo">Repositório: <code>Hub_de_Inovacao_PDI_GT</code></p>
    </main>
  </body>
</html>
